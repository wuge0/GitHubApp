<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixabay 素材候选 · GitHubApp 图标</title>
<style>
  :root{ --bg:#0d1117; --card:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#8b949e; --accent:#3fb950; }
  *{box-sizing:border-box}
  body{margin:0;padding:24px;background:var(--bg);color:var(--fg);
       font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--dim);margin:0 0 20px;font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;position:relative}
  .card .idx{position:absolute;top:8px;left:8px;background:var(--accent);color:#05240d;font-weight:700;
             font-size:12px;padding:2px 8px;border-radius:999px}
  .raw{width:100%;height:120px;object-fit:cover;border-radius:8px;background:#000;display:block}
  .sq{width:88px;height:88px;object-fit:cover;border-radius:20px;background:#000;display:block;margin:12px auto 0}
  .name{margin:10px 0 2px;font-size:13px;font-weight:600;word-break:break-all}
  .meta{color:var(--dim);font-size:12px}
  a{color:#58a6ff;text-decoration:none}
  a:hover{text-decoration:underline}
  .tip{margin-top:24px;padding:12px 14px;border:1px solid var(--line);border-left:3px solid var(--accent);
       border-radius:8px;background:var(--card);color:var(--dim);font-size:13px}
</style>
</head>
<body>
<h1>Pixabay 素材候选 · GitHubApp 图标</h1>
<p class="sub">上排＝原图，下排＝正方形裁切后的图标效果。挑一个编号告诉我，我裁成 1024 全套尺寸替换现有图标并重新出包。</p>

<div class="grid" id="g"></div>

<p class="tip">
  许可证：Pixabay Content License —— 免费商用、无需署名，但<strong>商标与品牌 logo 不在授权范围内</strong>，
  所以这里只收录了通用代码/编程主题素材，没放 GitHub 官方 logo 与 Octocat。
</p>

<script>
const CDN = "https://cdn.pixabay.com/photo/";
const items = [
  ["code-8779051","2024/05/21/19/58","jpg"],
  ["code-7146975","2022/04/21/08/20","png"],
  ["coding-1931667","2016/12/26/08/41","png"],
  ["coding-1841550","2016/11/19/22/52","jpg"],
  ["code-1076536","2015/12/04/14/05","jpg"],
  ["code-1839406","2016/11/19/14/00","jpg"],
  ["coding-924920","2015/09/05/20/02","jpg"],
  ["programming-1836330","2016/11/18/18/37","png"],
  ["programming-1873854","2016/11/30/20/58","png"],
  ["programming-2115930","2017/03/04/12/15","jpg"],
  ["binary-code-475664","2014/10/05/19/02","jpg"],
  ["matrix-356024","2014/05/27/23/32","jpg"],
  ["icons-7309514","2022/07/08/16/05","png"],
  ["technology-1283624","2016/03/27/18/54","jpg"],
  ["digital-484402","2014/10/11/10/05","jpg"],
  ["software-developer-6521720","2021/08/04/13/06","jpg"],
  ["visual-basic-906838","2015/08/25/13/21","png"],
  ["cloud-4828390","2020/02/07/21/05","jpg"]
];
const g = document.getElementById("g");
items.forEach(([name, dir, ext], i) => {
  const url = `${CDN}${dir}/${name}_1280.${ext}`;
  const page = `https://pixabay.com/images/search/${name.split('-')[0]}/`;
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `
    <span class="idx">${i + 1}</span>
    <img class="raw" src="${url}" alt="${name}" loading="lazy">
    <img class="sq" src="${url}" alt="${name} 方形裁切" loading="lazy">
    <div class="name">${name}</div>
    <div class="meta">1280px · <a href="${page}" target="_blank">Pixabay 原页</a></div>`;
  g.appendChild(el);
});
</script>
</body>
</html>
